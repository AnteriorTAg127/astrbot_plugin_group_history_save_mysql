name: astrbot_plugin_group_history_save_mysql
display_name: 群聊记录存储
desc: 将 QQ 群聊天记录保存到 MySQL，支持 Web 管理后台与群聊历史自动总结（MySQL 优先 + 协议端补齐）；图片总结支持自研报告模板（多 CDN 容灾/日夜双主题/排行柱状图）；人物分析支持群成员发言习惯与画像分析（@ 或 QQ 触发，Web 可跨群）；数据分析支持 Web 实时统计面板与 /群统计 指令报告卡（定时日报/周报推送 + 分段快照统计）
version: v0.6.0
author: AnteriorTAg127
repo: https://github.com/AnteriorTAg127/astrbot_plugin_group_history_save_mysql
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16"
